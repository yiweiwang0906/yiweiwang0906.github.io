title: "Yiwei (Derek) Wang"
description: "Operations Management | Retail Operations | Platform Operations | Human-AI Interactions"
url: "https://yiweiwang0906.github.io"
baseurl: ""
repository: "yiweiwang0906/yiweiwang0906.github.io"

# Theme (Minimal Mistakes via remote_theme)
remote_theme: "mmistakes/minimal-mistakes"
plugins:
  - jekyll-include-cache

locale: "en-US"
markdown: kramdown
permalink: /:categories/:title/

# Site author / sidebar
author:
  name: "Yiwei (Derek) Wang"
  avatar: "/assets/images/profile.jpg"
  bio: "Assistant Professor, Zhejiang University (ZIBS)"
  location: "Hangzhou, China"
  email: "yiweiwang@intl.zju.edu.cn"
  links:
    - label: "Google Scholar"
      icon: "fas fa-graduation-cap"
      url: "https://scholar.google.com/"
    - label: "SSRN"
      icon: "fas fa-file-alt"
      url: "https://papers.ssrn.com/"
    - label: "CV"
      icon: "fas fa-file-pdf"
      url: "/assets/cv/cv.pdf"

# Minimal Mistakes settings
minimal_mistakes_skin: "default"
breadcrumbs: true
search: false

# Defaults: use single layout style
defaults:
  - scope:
      path: ""
    values:
      layout: single
      author_profile: true
      classes: wide
